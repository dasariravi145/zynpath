server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    context-path: /

spring:
  application:
    name: zynpath-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    serialization:
      indent-output: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zynpath}?sslmode=${DB_SSL_MODE:prefer}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:zynpath_app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ZynpathHikariPool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    default-schema: ${FLYWAY_DEFAULT_SCHEMA:zynpath_app_schema}
    schemas: ${FLYWAY_SCHEMAS:zynpath_app_schema}
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

zynpath:
  multiplayer:
    puzzle-inventory:
      startup-prewarm-enabled: ${STARTUP_PREWARM_ENABLED:false}
  api:
    version: v1
    prefix: /api/v1
    base-url: ${BACKEND_BASE_URL:http://10.0.2.2:8080/api/v1}
    ws-url: ${BACKEND_WS_URL:ws://10.0.2.2:8080/ws}
  service-name: "Zynpath Game Service"
  environment: ${ENVIRONMENT:development}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:915374872001-92vjcvjb9v1b6t3n22g7suijb398n1cb.apps.googleusercontent.com}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      app-secret: ${FACEBOOK_APP_SECRET:}
    session:
      ttl-seconds: ${SESSION_TTL_SECONDS:2592000}
  billing:
    package-name: ${PLAY_PACKAGE_NAME:com.zynpath.game}
    service-account-json-path: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:}
    subscription-product-id: ${PLAY_SUBSCRIPTION_PRODUCT_ID:zynpath_premium}
    monthly-base-plan-id: ${PLAY_MONTHLY_BASE_PLAN_ID:premium-monthly}
    six-month-base-plan-id: ${PLAY_SIX_MONTH_BASE_PLAN_ID:premium-six-months}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:*}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
