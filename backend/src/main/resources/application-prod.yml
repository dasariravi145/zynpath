server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    serialization:
      indent-output: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zynpath}?currentSchema=zynpath_app_schema&sslmode=${DB_SSL_MODE:require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:zynpath_app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ZynpathProdHikariPool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: zynpath_app_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    default-schema: zynpath_app_schema
    schemas:
      - zynpath_app_schema
    create-schemas: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

zynpath:
  environment: production
  persistence:
    mode: jpa
  api:
    base-url: ${BACKEND_BASE_URL:}
    ws-url: ${BACKEND_WS_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:}
  logging:
    level:
      root: INFO
      com.zynpath.backend: INFO
      org.springframework.web: WARN
      org.springframework.security: WARN
