<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cyan Path Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Midnight Navy Background -->
  <rect width="512" height="512" rx="112" fill="#0B132B" />

  <!-- Grid Guidelines -->
  <path d="M 152,80 L 152,432 M 256,80 L 256,432 M 360,80 L 360,432 M 80,152 L 432,152 M 80,256 L 432,256 M 80,360 L 432,360"
        stroke="#1C2541" stroke-width="4" stroke-linecap="round" />

  <!-- Glow Underlay Ribbon -->
  <path d="M 152,152 L 360,152 L 360,256 L 152,256 L 152,360 L 360,360"
        fill="none" stroke="#00F5D4" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.35" filter="url(#cyanGlow)" />

  <!-- Core Path Ribbon -->
  <path d="M 152,152 L 360,152 L 360,256 L 152,256 L 152,360 L 360,360"
        fill="none" stroke="#00F5D4" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Checkpoint 1: Start (Forest Mint) -->
  <circle cx="152" cy="152" r="42" fill="#52B788" stroke="#FFFFFF" stroke-width="6" />
  <text x="152" y="167" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#0B132B" text-anchor="middle">1</text>

  <!-- Checkpoint 2: Middle (Forest Accent) -->
  <circle cx="152" cy="256" r="42" fill="#40916C" stroke="#FFFFFF" stroke-width="6" />
  <text x="152" y="271" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- Checkpoint 3: Final Goal (Accent Gold) -->
  <circle cx="360" cy="360" r="48" fill="#F59E0B" stroke="#FFFFFF" stroke-width="8" />
  <text x="360" y="376" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" fill="#0B132B" text-anchor="middle">3</text>
</svg>
