<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <filter id="wordmarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Title: Zynpath -->
  <text x="300" y="82" font-family="'Inter', 'Roboto', sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3" filter="url(#wordmarkGlow)">
    ZYN<tspan fill="#00F5D4">PATH</tspan>
  </text>

  <!-- Tagline: One path. Every number. -->
  <text x="300" y="128" font-family="'Inter', 'Roboto', sans-serif" font-size="20" font-weight="600" fill="#52B788" text-anchor="middle" letter-spacing="6">
    ONE PATH. EVERY NUMBER.
  </text>
</svg>
