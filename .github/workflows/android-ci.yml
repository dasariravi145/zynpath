name: Android CI / CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Release Version Code (e.g. 2)'
        required: false
        default: ''
      versionName:
        description: 'Release Version Name (e.g. 1.0.1)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # 1. Validation & Debug Assembly (PRs and Pushes to main)
  # ----------------------------------------------------------------------------
  validate-and-build:
    name: Validate and Build Debug
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Archive Debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zynpath-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ----------------------------------------------------------------------------
  # 2. Production Release Bundle (Manual Dispatch or Version Tag Only)
  # ----------------------------------------------------------------------------
  release-bundle:
    name: Build Production Release Bundle (AAB)
    needs: validate-and-build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Upload Keystore
        id: decode_keystore
        run: |
          if [ -z "${{ secrets.ZYNPATH_UPLOAD_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ZYNPATH_UPLOAD_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          KEYSTORE_DIR=$(mktemp -d)
          KEYSTORE_PATH="${KEYSTORE_DIR}/upload-keystore.jks"
          echo "${{ secrets.ZYNPATH_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > "${KEYSTORE_PATH}"
          echo "keystore_path=${KEYSTORE_PATH}" >> $GITHUB_OUTPUT

      - name: Build Release Android App Bundle (AAB)
        working-directory: android
        env:
          ZYNPATH_UPLOAD_KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path }}
          ZYNPATH_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ZYNPATH_UPLOAD_KEYSTORE_PASSWORD }}
          ZYNPATH_UPLOAD_KEY_ALIAS: ${{ secrets.ZYNPATH_UPLOAD_KEY_ALIAS }}
          ZYNPATH_UPLOAD_KEY_PASSWORD: ${{ secrets.ZYNPATH_UPLOAD_KEY_PASSWORD }}
          ZYNPATH_VERSION_CODE: ${{ github.event.inputs.versionCode }}
          ZYNPATH_VERSION_NAME: ${{ github.event.inputs.versionName }}
        run: |
          ./gradlew :app:bundleRelease --stacktrace

      - name: Generate Checksums & Provenance
        working-directory: android/app/build/outputs/bundle/release
        run: |
          sha256sum app-release.aab > app-release.aab.sha256
          echo "Commit: ${{ github.sha }}" >> provenance.txt
          echo "Ref: ${{ github.ref }}" >> provenance.txt
          echo "Actor: ${{ github.actor }}" >> provenance.txt
          echo "Build Date: $(date -u)" >> provenance.txt

      - name: Archive Production Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zynpath-release-aab-${{ github.sha }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
            android/app/build/outputs/bundle/release/provenance.txt
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Secure Cleanup of Temporary Keystore
        if: always()
        run: |
          if [ -n "${{ steps.decode_keystore.outputs.keystore_path }}" ] && [ -f "${{ steps.decode_keystore.outputs.keystore_path }}" ]; then
            shred -u "${{ steps.decode_keystore.outputs.keystore_path }}" || rm -f "${{ steps.decode_keystore.outputs.keystore_path }}"
          fi
